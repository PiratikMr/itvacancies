include "../secrets/local_airflow.conf"

FileSystem {
    path = "VacStorage"
}

Dags {
    ETL {
        minRows = 1
    }

    RefreshMatViews {
        schedule = "30 0 * * *"
    }

    DeleteData {
        schedule = "30 10 * * *"
        rawData = 30
        airflowLogs = 7
    }

    ArchiveDrive {
        schedule    = "0 4 * * *"
        archiveDays = 2
        remote      = "gdrive:ASH/hdfs"
        rcloneConf  = "/opt/airflow/conf/secrets/local_rclone.conf"
    }

    BackupDB {
        schedule  = ""
        keepDumps = 3
    }
}