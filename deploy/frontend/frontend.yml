services:
  frontend:
    image: node:20-alpine
    container_name: ${HOST_FRONTEND}
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      VITE_API_TARGET: "http://${HOST_API}:8000"
      VITE_POLL: "1"
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:${PORT_FRONTEND}:5173"
    restart: unless-stopped
    networks:
      - data_platform_net
    depends_on:
      - api

volumes:
  frontend_node_modules:
