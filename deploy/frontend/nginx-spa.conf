server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # Serve a prerendered /section/index.html when it exists, else fall
        # back to the SPA shell.
        try_files $uri $uri/index.html /index.html;
    }
}
