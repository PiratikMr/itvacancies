services:
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx
    entrypoint: ["/bin/sh", "/etc/nginx/entrypoint.sh"]
    ports:
      - "${PORT_HTTP}:80"
      - "${PORT_HTTPS}:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      - ./snippets:/etc/nginx/templates/snippets:ro
      - ./entrypoint.sh:/etc/nginx/entrypoint.sh:ro
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      DOMAIN: ${DOMAIN}
      AIRFLOW_SUBDOMAIN: ${AIRFLOW_SUBDOMAIN}
      GRAFANA_SUBDOMAIN: ${GRAFANA_SUBDOMAIN}

      FRONTEND_UPSTREAM: ${HOST_FRONTEND}:80
      API_UPSTREAM: ${HOST_API}:8000

      AIRFLOW_UPSTREAM: ${HOST_AIRFLOW_WEBSERVER}:8080
      GRAFANA_UPSTREAM: ${HOST_GRAFANA}:3000
    restart: unless-stopped
    networks:
      - data_platform_net
    depends_on:
      - frontend
      - api
      - airflow-webserver
      - grafana
