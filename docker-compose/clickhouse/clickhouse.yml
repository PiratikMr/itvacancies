services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.4.2
    container_name: clickhouse
    ports:
      - "127.0.0.1:18123:8123"
      - "127.0.0.1:19000:9000"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    env_file:
      - .env
    environment:
      CLICKHOUSE_DB: ${CH_DB_NAME:-analytics}
      CLICKHOUSE_USER: ${CH_USERNAME:-admin}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - data_platform_net
